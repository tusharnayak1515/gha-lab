name: Token Permissions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION2 || '22' }}
          cache: 'npm'
          cache-dependency-path: './node-ts-app/package-lock.json'
      - name: Install Dependencies
        working-directory: ./node-ts-app
        shell: bash
        run: npm ${{ vars.NPM_INSTALL_COMMAND2 || 'ci' }}
      - name: Build App
        working-directory: ./node-ts-app
        shell: bash
        run: npm run ${{ vars.NPM_BUILD_COMMAND2 || 'build' }}
      - name: Test App
        working-directory: ./node-ts-app
        shell: bash
        run: npm run ${{ vars.NPM_TEST_COMMAND2 || 'test' }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: node-ts-app/dist/
          retention-days: 1
          include-hidden-files: true
  publish:
    name: Publish Artifact
    needs: [test]
    if: ${{ always() && needs.test.result == 'success' && !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION2 || '22' }}
          cache: 'npm'
          cache-dependency-path: './node-ts-app/package-lock.json'
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: app/
      - name: Publish Package
        shell: bash
        working-directory: './node-ts-app'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
