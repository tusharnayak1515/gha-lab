name: Build Node.Js App

on:
  push:
    branches: ['main','release/*']
  pull_request:
    branches: ['main','release/*']
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION2 }}
      - name: Install Dependencies
        shell: bash
        working-directory: ./node-ts-app
        run: npm ${{ vars.NODE_INSTALL_COMMAND2 || 'ci' }}
      - name: Build App
        shell: bash
        working-directory: ./node-ts-app
        run: npm run ${{ vars.NODE_BUILD_COMMAND2 || 'build' }}
  test:
    name: Test - Parallel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION2 }}
      - name: Install Dependencies
        shell: bash
        working-directory: ./node-ts-app
        run: npm ${{ vars.NODE_INSTALL_COMMAND2 || 'ci' }}
      - name: Test App
        shell:  bash
        working-directory: ./node-ts-app
        run: npm run ${{ vars.NODE_TEST_COMMAND2 || 'test' }}
  test2:
    name: Test - Sequential
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION2 }}
      - name: Install Dependencies
        shell: bash
        working-directory: ./node-ts-app
        run: npm ${{ vars.NODE_INSTALL_COMMAND2 || 'ci' }}
      - name: Test App
        shell:  bash
        working-directory: ./node-ts-app
        run: npm run ${{ vars.NODE_TEST_COMMAND2 || 'test' }}
