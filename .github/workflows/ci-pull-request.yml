name: CI - Pull Request

on:
  pull_request:
    branches: ['feature/pr']

run-name: CI - PR - Protected

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Read PR Title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Reading PR title...."
          echo "Title: $PR_TITLE"
