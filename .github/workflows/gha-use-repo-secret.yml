name: Use Repo Secret

on:
  workflow_dispatch:

jobs:
  print-secret:
    name: Use Repo Secret
    runs-on: ubuntu-latest
    steps:
      - name: Consume secret
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          touch .env
          echo "SECRET_TOKEN=$SECRET_TOKEN" >> .env
          echo "============================================="
          echo "Used repo secret."

          cat .env